# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release
  SOLUTION_FILE: DuongNhan-project2.slnx
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache NuGet global packages folder (works with setup-dotnet too)
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Cache build outputs (obj/bin) to speed up incremental builds
      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            **/obj
            **/bin
          key: build-${{ runner.os }}-${{ env.CONFIGURATION }}-${{ hashFiles('**/*.csproj', '**/*.cs', '**/*.razor', '**/*.slnx') }}
          restore-keys: |
            build-${{ runner.os }}-${{ env.CONFIGURATION }}-

      # Cache dotnet format tool + analyzer state
      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: dotnettools-${{ runner.os }}-${{ hashFiles('**/dotnet-tools.json') }}
          restore-keys: |
            dotnettools-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'   # remove once .NET 10 is GA

      - name: Show SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore "$SOLUTION_FILE"

      - name: Format check
        continue-on-error: true
        run: dotnet format "$SOLUTION_FILE" --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build "$SOLUTION_FILE" --configuration $CONFIGURATION --no-restore

      - name: Test
        run: >
          dotnet test "$SOLUTION_FILE"
          --configuration $CONFIGURATION
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore

      - name: Upload build output (Web)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: DuongNhan-project2.Web/bin/${{ env.CONFIGURATION }}/net10.0/
          if-no-files-found: ignore